name: vkapriltag parity gate

# Builds the Vulkan-compute pipeline with no upstream and runs every default test (no network needed), then builds
# it again with VKAPRILTAG_UPSTREAM_VALIDATION=ON and runs apriltag_synth_ground_truth as a regression gate:
# it fails if the stock libapriltag / vkapriltag pose delta exceeds a threshold.
# Runs on Mesa's software Vulkan (lavapipe), as the runners have no GPU.

on:
  push:
    branches: [main]
    paths:
      - "apriltags_vulkan/**"
      - ".github/workflows/vkapriltag-parity.yml"
  pull_request:
    paths:
      - "apriltags_vulkan/**"
      - ".github/workflows/vkapriltag-parity.yml"

jobs:
  parity-gate:
    runs-on: ubuntu-latest
    env:
      # Allows the software Vulkan device that vk/Context.cpp rejects by default.
      APRILTAG_VK_ALLOW_CPU: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install build and Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential \
            libvulkan-dev glslang-tools mesa-vulkan-drivers vulkan-tools \
            libopencv-dev

      - name: Locate the lavapipe ICD and point the loader at it
        # Locates the lavapipe ICD json under the standard ICD directories.
        run: |
          echo "Files mesa-vulkan-drivers actually installed under vulkan/icd.d:"
          dpkg -L mesa-vulkan-drivers | grep icd.d || echo "  (none reported by dpkg)"
          echo "Broader search of the standard ICD directories:"
          find /usr/share/vulkan /etc/vulkan -iname '*.json' 2>/dev/null

          icd=$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -iname '*lvp*.json' 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then
            echo "::error::no lavapipe ICD json found under the standard search paths - see the file listing above"
            exit 1
          fi
          echo "Using ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Verify the software Vulkan device is visible
        # Fails early if the discovered ICD does not work.
        run: |
          vulkaninfo --summary
          vulkaninfo --summary | grep -q "deviceType.*CPU" || \
            (echo "::error::no CPU/software Vulkan device found even with VK_ICD_FILENAMES=$VK_ICD_FILENAMES" && exit 1)

      - name: Configure (no upstream)
        run: cmake -B build -S apriltags_vulkan -DCMAKE_BUILD_TYPE=Release

      - name: Build (no upstream)
        run: cmake --build build -j

      - name: Check that nothing from upstream libapriltag was fetched
        run: |
          if [ -d build/_deps ]; then
            echo "::error::the default build fetched dependencies: $(ls build/_deps)"
            exit 1
          fi

      - name: Run the default tests
        # Unit tests, the decode differential test against the recorded upstream vectors, the golden detections
        # (same IDs and corners within 0.02 px of the goldens made on a desktop GPU, tests/golden_test.py), the
        # lints and the installed-package consumer.
        run: ctest --test-dir build --output-on-failure

      - name: Configure with upstream validation
        run: cmake -B build-parity -S apriltags_vulkan -DCMAKE_BUILD_TYPE=Release -DVKAPRILTAG_UPSTREAM_VALIDATION=ON

      - name: Build with upstream validation
        run: cmake --build build-parity -j

      - name: Run libapriltag-vs-vkapriltag parity gate
        id: gate
        run: |
          set -o pipefail
          ./build-parity/tools/apriltag_synth_ground_truth | tee gate_output.txt

      - name: Publish results to job summary
        if: always()
        run: |
          {
            echo "## libapriltag vs vkapriltag parity"
            echo '```'
            cat gate_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
