name: Release .deb packages

# Builds the vkapriltag library natively on amd64 and arm64 for tags matching vMAJOR.MINOR.PATCH,
# packages each as a .deb via CPack and publishes both to a GitHub Release.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive package version from tag
        # Accept strict vMAJOR.MINOR.PATCH tags only.
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "PKG_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        # No libopencv-dev: only tools/ need OpenCV and they are built with -DVKAPRILTAG_BUILD_TOOLS=OFF.
        # Nothing is fetched at configure time: the library uses no upstream libapriltag.
        # No glslang-tools: Ubuntu 24.04's 15.1 cannot compile the integer dot product shader
        # (GL_EXT_integer_dot_product needs glslang 15.2 or later), so glslang is built below.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential dpkg-dev git python3 \
            libvulkan-dev

      - name: Build glslang
        # About half a minute on either architecture.
        run: |
          git clone --depth 1 --branch 16.2.0 https://github.com/KhronosGroup/glslang.git
          cmake -S glslang -B glslang/build -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=OFF \
            -DENABLE_CTEST=OFF -DBUILD_EXTERNAL=OFF -DCMAKE_INSTALL_PREFIX="$HOME/glslang"
          cmake --build glslang/build -j --target install
          echo "$HOME/glslang/bin" >> "$GITHUB_PATH"
          "$HOME/glslang/bin/glslangValidator" --version | head -1

      - name: Configure
        run: |
          cmake -B build -S apriltags_vulkan \
            -DCMAKE_BUILD_TYPE=Release \
            -DVKAPRILTAG_BUILD_APPS=OFF \
            -DVKAPRILTAG_BUILD_TOOLS=OFF \
            -DVKAPRILTAG_DOT_SHADER=ON \
            -DCPACK_PACKAGE_VERSION="${PKG_VERSION}"

      - name: Build
        run: cmake --build build -j

      - name: Package
        run: cd build && cpack

      - name: Check the package includes the integer dot product shader
        run: dpkg-deb -c build/*.deb | grep decimate_box_dot_u8.comp.spv

      - name: Check the package has no libapriltag
        # The library does not use upstream: no upstream files in the package, no dependency on it, nothing fetched.
        run: |
          if dpkg-deb -c build/*.deb | grep -v '/vkapriltag/' | grep -E '/(lib)?apriltag(\.|-|_pose)|/include/apriltag/|/tag(16h5|25h9|36h11)\.h'; then
            echo "::error::the package holds files from upstream libapriltag"
            exit 1
          fi
          dpkg-deb -f build/*.deb Depends
          if dpkg-deb -f build/*.deb Depends | grep -i apriltag; then
            echo "::error::the package depends on a libapriltag package"
            exit 1
          fi
          if [ -d build/_deps ]; then
            echo "::error::the build fetched dependencies: $(ls build/_deps)"
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: vkapriltag-deb-${{ matrix.arch }}
          path: build/*.deb

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vkapriltag-deb-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
