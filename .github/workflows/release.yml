name: Release .deb packages

# Pushing a tag matching vMAJOR.MINOR.PATCH builds the vkapriltag library
# (headers + static lib + embedded-shader-free SPIR-V corpus + CMake package
# config - the same scope as library/CMakeLists.txt's install() rules, no
# tools/apps) natively for amd64 and arm64, packages each as a .deb via
# CPack, and publishes both as assets on a GitHub Release for that tag.
#
# Native arm64 build (ubuntu-24.04-arm, a free GitHub-hosted runner on
# public repos) rather than cross-compilation: this repo links Vulkan +
# FetchContent's own apriltag build, and cross-linking those reliably would
# need multiarch apt sources for no real benefit when a native arm64 runner
# is available for free.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive package version from tag
        # Strict vMAJOR.MINOR.PATCH only (no -rc/build-metadata suffixes) -
        # fail fast before any build/apt work if the tag doesn't match,
        # rather than producing a release with a nonsensical version.
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "PKG_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        # No libopencv-dev: the packaged library itself has no OpenCV
        # dependency (only tools/, which this release build excludes via
        # -DVKAPRILTAG_BUILD_TOOLS=OFF below).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential dpkg-dev \
            libvulkan-dev glslang-tools

      - name: Configure
        run: |
          cmake -B build -S apriltags_vulkan \
            -DCMAKE_BUILD_TYPE=Release \
            -DVKAPRILTAG_BUILD_APPS=OFF \
            -DVKAPRILTAG_BUILD_TOOLS=OFF \
            -DCPACK_PACKAGE_VERSION="${PKG_VERSION}"

      - name: Build
        run: cmake --build build -j

      - name: Package
        run: cd build && cpack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: vkapriltag-deb-${{ matrix.arch }}
          path: build/*.deb

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vkapriltag-deb-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
